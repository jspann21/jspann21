name: Refresh project counts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_profile_counts.py
      - .github/workflows/update-profile-counts.yml

permissions:
  contents: write

concurrency:
  group: profile-counts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jspann21/jspann21' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Refresh star, fork, and download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_counts.py

      - name: Save changed counts
        shell: bash
        run: |
          git add -- README.md profile-assets/counts
          if git diff --cached --quiet; then
            echo 'Counts have not changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh project star, fork, and download counts'
          git push
